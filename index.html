<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automatize360</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141516;--s1:#1b1c1e;--s2:#232427;--border:#2f3135;--text:#e6e6e3;--dim:#a3a6ab;--muted:#70747a;--accent:#3fb97f;--accent-d:rgba(63,185,127,.12);--sidebar:216px;color-scheme:dark}
:root[data-theme="light"]{--bg:#f3f3f1;--s1:#ffffff;--s2:#f0f0ed;--border:#dcdcd7;--text:#1c1d1f;--dim:#55585d;--muted:#84878c;--accent:#1b8a57;--accent-d:rgba(27,138,87,.10);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;display:flex}
.sidebar{width:var(--sidebar);height:100vh;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100}
.sb-logo{padding:18px 16px 14px}
.sb-logo img{display:block;width:100%;max-width:170px;height:auto}
.lg-l{display:none!important}
:root[data-theme="light"] .lg-d{display:none!important}
:root[data-theme="light"] .lg-l{display:block!important}
.sb-nav{flex:1;padding:6px 8px}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--dim);user-select:none;margin-bottom:2px;border:0;background:none;width:100%;font-family:inherit;text-align:left}
.sb-item:hover{background:var(--s2);color:var(--text)}
.sb-item.active{background:var(--accent-d);color:var(--accent)}
.sb-item svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sb-foot{padding:8px;border-top:1px solid var(--border)}
#btn-conta{display:none}
#btn-conta.on{display:flex}
.main{margin-left:var(--sidebar);flex:1;height:100vh;position:relative;min-width:0}
.main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
.main iframe.active{display:block}
@media(max-width:700px){
  .sidebar{width:52px}
  .sb-item span{display:none}
  .sb-logo{padding:14px 6px}
  .sb-item{justify-content:center;padding:10px}
  .main{margin-left:52px}
}
.lg-gate{display:none}
#login{position:fixed;inset:0;z-index:1000;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
#login.on{display:flex}
.lg-box{width:100%;max-width:360px;background:var(--s1);border:1px solid var(--border);border-radius:8px;padding:28px}
.lg-box img{display:block;width:200px;max-width:100%;margin:0 0 22px}
.lg-box label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:0 0 5px}
.lg-box input{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:9px 11px;font-size:13px;font-family:inherit;color:var(--text);outline:none;margin-bottom:14px}
.lg-box input:focus{border-color:var(--accent)}
.lg-box button{width:100%;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:10px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
:root[data-theme="dark"] .lg-box button{color:#07140d}
.lg-box button:disabled{opacity:.6;cursor:default}
#lg-err{font-size:12px;color:#e5484d;min-height:16px;margin-top:10px;text-align:center}
.lg-box .lg-l{display:none}
:root[data-theme="light"] .lg-box .lg-d{display:none}
:root[data-theme="light"] .lg-box .lg-l{display:block}

.lg-box .lg-extra{display:none}
.lg-box.cad .lg-extra{display:block}
.lg-alt{margin-top:14px;text-align:center;font-size:12px;color:var(--muted)}
.lg-alt a{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:none}
#lg-ok{font-size:12px;color:var(--accent);text-align:center;margin-top:10px}
.adm{position:absolute;inset:0;overflow:auto;padding:28px clamp(16px,3vw,40px);display:none}
.adm.active{display:block}
.adm h2{font-size:18px;font-weight:600;margin-bottom:4px}
.adm .sub{font-size:12px;color:var(--muted);margin-bottom:22px}
.adm h3{font-size:12px;font-weight:600;color:var(--dim);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.adm .row{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--border);border-radius:8px;padding:11px 14px;margin-bottom:8px;flex-wrap:wrap}
.adm .who{flex:1;min-width:180px}
.adm .who b{display:block;font-size:13px;font-weight:600}
.adm .who span{font-size:12px;color:var(--muted)}
.adm .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--s2);color:var(--dim)}
.adm .tag.ok{background:var(--accent-d);color:var(--accent)}
.adm .tag.pend{background:rgba(217,162,27,.14);color:#c28f12}
.adm button{border:1px solid var(--border);background:var(--s2);color:var(--text);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.adm button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .adm button.pri{color:#07140d}
.adm button.perigo{color:#e5484d}
.adm .vazio{font-size:12px;color:var(--muted);padding:6px 2px}
#nav-adm{display:none}
#nav-adm.on{display:flex}
</style>
</head>

function aplicaTema(f, t) {
  try { f.contentDocument.documentElement.setAttribute('data-pt', t);
        f.contentDocument.documentElement.setAttribute('data-theme', t); } catch (e) {}
}
function tema() { return document.documentElement.getAttribute('data-theme'); }
function setTema(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('tema-lbl').textContent = t === 'dark' ? 'Tema claro' : 'Tema escuro';
  try { localStorage.setItem('painel_tema', t); } catch (e) {}
  ['waba', 'tpl', 'ib'].forEach(function (k) { aplicaTema(document.getElementById('f-' + k), t); });
}
function toggleTema() { setTema(tema() === 'dark' ? 'light' : 'dark'); }
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('painel_tema') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
})();

var KEY = null;
function b64(b) { var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
function guardaChave(k) {
  return crypto.subtle.importKey('raw', b64(k), 'AES-GCM', false, ['decrypt']).then(function (c) { KEY = c; });
}
function decifra(id) {
  var el = document.getElementById(SRC[id]);
  if (el.type === 'text/html') return Promise.resolve(el.textContent.replace(/<\\\/script>/g, '<' + '/script>'));
  var d = b64(el.textContent.trim());
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.slice(0, 12) }, KEY, d.slice(12))
    .then(function (buf) { return new TextDecoder().decode(buf); });
}

function load(id) {
  var f = document.getElementById('f-' + id);
  if (f.dataset.loaded || (!KEY && document.getElementById(SRC[id]).type !== 'text/html')) return;
  f.dataset.loaded = '1';
  decifra(id).then(function (raw) {
    var extra = '<style id="pt-style">' + PT_CSS + '</style>' +
      '<script>document.documentElement.setAttribute("data-pt","' + tema() + '");document.documentElement.setAttribute("data-theme","' + tema() + '");<' + '/script>';
    f.addEventListener('load', function () { aplicaTema(f, tema()); });
    f.srcdoc = raw + extra;
  }).catch(function () { f.dataset.loaded = ''; });
}

function show(id) {
  cur = id;
  if (id !== 'adm') load(id);
  ['waba', 'tpl', 'ib'].forEach(function (k) {
    document.getElementById('f-' + k).classList.toggle('active', k === id);
    document.getElementById('nav-' + k).classList.toggle('active', k === id);
  });
  document.getElementById('f-adm').classList.toggle('active', id === 'adm');
  document.getElementById('nav-adm').classList.toggle('active', id === 'adm');
  document.getElementById('btn-conta').classList.toggle('on', id === 'ib');
  if (id === 'adm') carregaUsuarios();
}

// "Trocar conta" do Infobip (chama a mesma função original dentro do site)
function trocarConta() {
  try { document.getElementById('f-ib').contentWindow.limparCfg(); } catch (e) {}
}

// Ponte para a extensão do Chrome (a extensão fala com a página principal)
document.getElementById('f-waba').addEventListener('load', function () {
  var wc = this.contentWindow;
  try {
    wc.addEventListener('message', function (e) {
      var d = e.data;
      if (d && d.source === 'waba-manager') window.postMessage(d, '*');
    });
    if (extReady) wc.postMessage(extReady, '*');
  } catch (err) {}
});

window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || typeof d !== 'object') return;
  var wc = document.getElementById('f-waba').contentWindow;
  if (e.source === window && d.source === 'waba-extension') {
    if (d.action === 'EXTENSION_READY' || d.action === 'FB_LOGIN_STATUS') extReady = d;
    if (wc) wc.postMessage(d, '*');
  }
});

/* ---------- Login (usuários no banco, via n8n) ---------- */
var AUTH = 'https://rarelookingorca-n8n.cloudfy.live/webhook/';
function mostraLogin(on) { document.getElementById('login').classList.toggle('on', on); if (on) document.getElementById('lg-u').focus(); }

var modo = 'login';
function trocaModo() {
  modo = modo === 'login' ? 'cad' : 'login';
  var box = document.querySelector('.lg-box');
  box.classList.toggle('cad', modo === 'cad');
  document.getElementById('lg-b').textContent = modo === 'cad' ? 'Criar conta' : 'Entrar';
  document.getElementById('lg-ul').textContent = modo === 'cad' ? 'E-mail' : 'Usuário';
  document.getElementById('lg-alt-t').textContent = modo === 'cad' ? 'Já tem conta?' : 'Não tem conta?';
  document.getElementById('lg-alt-a').textContent = modo === 'cad' ? 'Entrar' : 'Criar conta';
  document.getElementById('lg-err').textContent = ''; document.getElementById('lg-ok').textContent = '';
}
function cadastrar(ev) {
  var b = document.getElementById('lg-b'), er = document.getElementById('lg-err'), ok = document.getElementById('lg-ok');
  var n = document.getElementById('lg-n').value.trim(), u = document.getElementById('lg-u').value.trim();
  var s = document.getElementById('lg-s').value, s2 = document.getElementById('lg-s2').value;
  er.textContent = ''; ok.textContent = '';
  if (!n) { er.textContent = 'Informe seu nome.'; return false; }
  if (s.length < 8) { er.textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return false; }
  if (s !== s2) { er.textContent = 'As senhas não conferem.'; return false; }
  b.disabled = true;
  fetch(AUTH + 'painel-cadastro', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nome: n, usuario: u, senha: s }) })
    .then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (d) {
      if (d && d.ok) {
        trocaModo();
        document.getElementById('lg-s').value = ''; document.getElementById('lg-s2').value = '';
        document.getElementById('lg-ok').textContent = 'Cadastro enviado. Aguarde a aprovação para entrar.';
      } else { er.textContent = (d && d.error) || 'Não foi possível cadastrar.'; }
    })
    .catch(function () { er.textContent = 'Não foi possível conectar. Tente novamente.'; })
    .then(function () { b.disabled = false; });
  return false;
}

/* ---------- Admin: aprovar / recusar usuários ---------- */
function admCall(acao, id) {
  var t = null; try { t = localStorage.getItem('painel_token'); } catch (e) {}
  return fetch(AUTH + 'painel-admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: t, acao: acao, id: id || '' }) })
    .then(function (r) { return r.json().catch(function () { return {}; }); }).catch(function () { return {}; });
}
function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function linhaUsuario(u) {
  var data = u.criado_em ? new Date(u.criado_em).toLocaleDateString('pt-BR') : '';
  var tag = u.admin ? '<span class="tag ok">Administrador</span>' : (u.ativo ? '<span class="tag ok">Ativo</span>' : '<span class="tag pend">Pendente</span>');
  var bt = '';
  if (!u.admin) {
    if (!u.ativo) bt = '<button class="pri" onclick="admAcao(\'aprovar\',' + u.id + ')">Aprovar</button><button class="perigo" onclick="admAcao(\'recusar\',' + u.id + ')">Recusar</button>';
    else bt = '<button onclick="admAcao(\'desativar\',' + u.id + ')">Desativar</button><button class="perigo" onclick="admAcao(\'recusar\',' + u.id + ')">Excluir</button>';
  }
  return '<div class="row"><div class="who"><b>' + esc(u.nome || u.usuario) + '</b><span>' + esc(u.usuario) + (data ? ' · ' + data : '') + '</span></div>' + tag + bt + '</div>';
}
function renderUsuarios(lista) {
  var pend = lista.filter(function (u) { return !u.ativo && !u.admin; }), resto = lista.filter(function (u) { return u.ativo || u.admin; });
  document.getElementById('adm-body').innerHTML =
    '<h3>Aguardando aprovação (' + pend.length + ')</h3>' + (pend.length ? pend.map(linhaUsuario).join('') : '<div class="vazio">Nenhum cadastro pendente.</div>') +
    '<h3>Usuários com acesso (' + resto.length + ')</h3>' + resto.map(linhaUsuario).join('');
}
function carregaUsuarios() { return admCall('listar').then(function (d) { if (d && d.ok) renderUsuarios(d.usuarios || []); }); }
function admAcao(a, id) {
  if (a === 'recusar' && !confirm('Remover este usuário? Essa ação não pode ser desfeita.')) return;
  admCall(a, id).then(function () { return carregaUsuarios(); });
}
function checaAdmin() {
  return admCall('listar').then(function (d) {
    var on = !!(d && d.ok);
    document.getElementById('nav-adm').classList.toggle('on', on);
    if (on) renderUsuarios(d.usuarios || []);
  });
}

function entrar(ev) {
  ev.preventDefault();
  var b = document.getElementById('lg-b'), er = document.getElementById('lg-err');
  b.disabled = true; er.textContent = '';
  fetch(AUTH + 'painel-login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usuario: document.getElementById('lg-u').value.trim(), senha: document.getElementById('lg-s').value }) })
    .then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (d) {
      if (d && d.ok && d.token) {
        try { localStorage.setItem('painel_token', d.token); } catch (e) {}
        document.getElementById('lg-s').value = '';
        return pegaChave(d.token).then(function (ok) {
          if (ok) { mostraLogin(false); show(cur); checaAdmin(); } else { er.textContent = 'Não foi possível abrir o painel.'; }
        });
      } else { er.textContent = 'Usuário ou senha inválidos, ou cadastro aguardando aprovação.'; }
    })
    .catch(function () { er.textContent = 'Não foi possível conectar. Tente novamente.'; })
    .then(function () { b.disabled = false; });
  return false;
}
function sair() { try { localStorage.removeItem('painel_token'); } catch (e) {} location.reload(); }
function pegaChave(t) {
  return fetch(AUTH + 'painel-chave', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: t }) })
    .then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (d) { return (d && d.ok && d.k) ? guardaChave(d.k).then(function () { return true; }) : false; })
    .catch(function () { return false; });
}
function checaSessao() {
  var t = null; try { t = localStorage.getItem('painel_token'); } catch (e) {}
  if (!t) { mostraLogin(true); return; }
  pegaChave(t).then(function (ok) {
    if (ok) { show('waba'); checaAdmin(); }
    else { try { localStorage.removeItem('painel_token'); } catch (e) {} mostraLogin(true); }
  });
}

document.addEventListener('DOMContentLoaded', function () {
  setTema(tema());
  checaSessao();
});
</script>
